# AI review for our OpenReplay changes (the caeli/* branches). This repo is a
# PUBLIC fork, so it must never run on Mini's self-hosted runner: the review
# runs on GitHub's ubuntu-latest, takes the model key from repo secrets, and
# posts as github-actions[bot]. GitHub withholds secrets from PRs opened from
# other forks, so only people with push access can spend the key.
#
# reviewer_ref is pinned to a COMMIT of the public tingyiy/agentic-review (the
# one its `deployed` tag pointed at on 2026-10-17), so a merge there reaches
# this repo only when someone bumps the pin here.
name: PR review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, synchronize, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  statuses: write
  actions: read

jobs:
  review:
    uses: tingyiy/agentic-review/.github/workflows/pr-review.yml@f1c72f2b0fc8dc85436d68e62171ab20a75a2b7b
    with:
      bot_login: github-actions[bot]
      post_as_actions_bot: true
      runner: '["ubuntu-latest"]'
      reviewer_ref: f1c72f2b0fc8dc85436d68e62171ab20a75a2b7b
      ticket_pattern: ""
    secrets:
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
